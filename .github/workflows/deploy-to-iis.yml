name: Deploy to IIS Server

on:
  push:
    branches:
      - feature/Iframe

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 还原依赖项
      run: dotnet restore AI.DeliciousFood.sln
      
    - name: 构建解决方案
      run: dotnet build AI.DeliciousFood.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
    - name: 发布 Web.Client
      run: dotnet publish AI.DeliciousFood.Web.Client/AI.DeliciousFood.Web.Client.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish/client --no-build
      
    - name: 发布 Web.Manage
      run: dotnet publish AI.DeliciousFood.Web.Manage/AI.DeliciousFood.Web.Manage.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish/manage --no-build
      
    - name: 移除配置文件
      run: |
        Remove-Item -Path "./publish/client/appsettings.json" -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "./publish/client/appsettings.Development.json" -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "./publish/manage/appsettings.json" -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "./publish/manage/appsettings.Development.json" -Force -ErrorAction SilentlyContinue
        Write-Host "已移除 appsettings.json 文件,请在服务器上手动配置"
      
    - name: 准备部署包
      run: |
        Compress-Archive -Path ./publish/client/* -DestinationPath client-deploy.zip
        Compress-Archive -Path ./publish/manage/* -DestinationPath manage-deploy.zip
        
    - name: 部署到 IIS 服务器
      shell: pwsh
      env:
        SERVER_HOST: ${{ secrets.IIS_SERVER_HOST }}
        SERVER_USERNAME: ${{ secrets.IIS_SERVER_USERNAME }}
        SERVER_PASSWORD: ${{ secrets.IIS_SERVER_PASSWORD }}
        CLIENT_DEPLOY_PATH: ${{ secrets.CLIENT_DEPLOY_PATH }}
        MANAGE_DEPLOY_PATH: ${{ secrets.MANAGE_DEPLOY_PATH }}
        CLIENT_SITE_NAME: ${{ secrets.CLIENT_SITE_NAME }}
        MANAGE_SITE_NAME: ${{ secrets.MANAGE_SITE_NAME }}
      run: |
        # 创建远程会话
        $secpasswd = ConvertTo-SecureString $env:SERVER_PASSWORD -AsPlainText -Force
        $creds = New-Object System.Management.Automation.PSCredential ($env:SERVER_USERNAME, $secpasswd)
        
        # 使用 WinRM 部署
        $session = New-PSSession -ComputerName $env:SERVER_HOST -Credential $creds
        
        # 上传并部署 Client
        Copy-Item -Path "./client-deploy.zip" -Destination "C:\Temp\client-deploy.zip" -ToSession $session
        Invoke-Command -Session $session -ScriptBlock {
          param($deployPath, $siteName)
          
          # 停止站点
          Import-Module WebAdministration
          Stop-WebSite -Name $siteName
          Start-Sleep -Seconds 5
          
          # 备份旧文件
          $backupPath = "$deployPath-backup-$(Get-Date -Format 'yyyyMMddHHmmss')"
          if (Test-Path $deployPath) {
            Copy-Item -Path $deployPath -Destination $backupPath -Recurse
          }
          
          # 清理旧文件
          Remove-Item -Path "$deployPath\*" -Recurse -Force
          
          # 解压新文件
          Expand-Archive -Path "C:\Temp\client-deploy.zip" -DestinationPath $deployPath -Force
          Remove-Item -Path "C:\Temp\client-deploy.zip" -Force
          
          # 启动站点
          Start-WebSite -Name $siteName
        } -ArgumentList $env:CLIENT_DEPLOY_PATH, $env:CLIENT_SITE_NAME
        
        # 上传并部署 Manage
        Copy-Item -Path "./manage-deploy.zip" -Destination "C:\Temp\manage-deploy.zip" -ToSession $session
        Invoke-Command -Session $session -ScriptBlock {
          param($deployPath, $siteName)
          
          # 停止站点
          Import-Module WebAdministration
          Stop-WebSite -Name $siteName
          Start-Sleep -Seconds 5
          
          # 备份旧文件
          $backupPath = "$deployPath-backup-$(Get-Date -Format 'yyyyMMddHHmmss')"
          if (Test-Path $deployPath) {
            Copy-Item -Path $deployPath -Destination $backupPath -Recurse
          }
          
          # 清理旧文件
          Remove-Item -Path "$deployPath\*" -Recurse -Force
          
          # 解压新文件
          Expand-Archive -Path "C:\Temp\manage-deploy.zip" -DestinationPath $deployPath -Force
          Remove-Item -Path "C:\Temp\manage-deploy.zip" -Force
          
          # 启动站点
          Start-WebSite -Name $siteName
        } -ArgumentList $env:MANAGE_DEPLOY_PATH, $env:MANAGE_SITE_NAME
        
        # 关闭会话
        Remove-PSSession -Session $session
        
    - name: 验证部署
      if: success()
      run: |
        Write-Host "✅ 部署成功完成！"
        Write-Host "Client 站点已更新"
        Write-Host "Manage 站点已更新"
